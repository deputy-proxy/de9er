name: Publish design gallery to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "design-intelligence/examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare the public gallery artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/design-intelligence/examples
          cp index.html _site/index.html

          for demo in design-intelligence/examples/*/index.html; do
            destination="_site/${demo%/index.html}"
            mkdir -p "$destination"
            cp "$demo" "$destination/index.html"
          done

          touch _site/.nojekyll
          demo_count=$(find _site/design-intelligence/examples -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "Prepared $demo_count standalone design demos."
          test "$demo_count" -gt 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
